name: Create Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0, v1.0.0, etc.

permissions:
  contents: write

jobs:
  extract-changelog:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      changelog: ${{ steps.changelog.outputs.CHANGELOG_CONTENT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          if [ -f CHANGELOG ]; then
            # Extract the section for this version from CHANGELOG
            VERSION="${{ github.ref_name }}"
            # Remove any suffix after the version (e.g., -test, -rc1)
            VERSION_CLEAN=$(echo "$VERSION" | sed 's/-.*$//')
            # Escape dots in version for regex
            VERSION_ESCAPED=$(echo "$VERSION_CLEAN" | sed 's/\./\\./g')
            # Use awk to extract content: start at version header (format: v1.5.2 - [date]), stop at next version header
            CHANGES=$(awk "BEGIN{p=0} /^$VERSION_ESCAPED - /{p=1;next} /^v[0-9].*- \[/{p=0} p" CHANGELOG | sed '/^$/d')

            if [ -z "$CHANGES" ]; then
              echo "CHANGELOG_CONTENT=No changelog entry found for this version." >> $GITHUB_OUTPUT
            else
              # Escape newlines for GitHub output
              echo "CHANGELOG_CONTENT<<EOF" >> $GITHUB_OUTPUT
              echo "$CHANGES" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          else
            echo "CHANGELOG_CONTENT=CHANGELOG not found." >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: windows-latest
    needs: extract-changelog
    strategy:
      matrix:
        include:
          - platform: Win32
            archive_name: AlpacaZorroPlugin
          - platform: x64
            archive_name: AlpacaZorroPlugin64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: cmake -B build -A ${{ matrix.platform }}

      - name: Build
        run: cmake --build build --config Release

      - name: Create archive
        run: |
          # Create include directory
          New-Item -Path "build/bin/Release/include" -ItemType Directory -Force

          # Copy header file
          Copy-Item -Path "alpaca_zorro_plugin/AlpacaBrokerCommands.h" -Destination "build/bin/Release/include/"

          # Copy websocket_proxy binaries (copy contents of bin, not bin itself)
          Copy-Item -Path "3rdparty/websocket_proxy/bin/*" -Destination "build/bin/Release/websocket_proxy" -Recurse

          # Create dist directory
          New-Item -Path "build/dist" -ItemType Directory -Force

          # Create zip from bin/Release directory (matching CMake behavior)
          # CMake uses: WORKING_DIRECTORY "${CMAKE_BINARY_DIR}/bin/Release"
          # So we need to zip from inside that directory
          Push-Location "build/bin/Release"
          Compress-Archive -Path "*" -DestinationPath "../../dist/${{ matrix.archive_name }}_${{ needs.extract-changelog.outputs.version }}.zip" -Force
          Pop-Location
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}_${{ needs.extract-changelog.outputs.version }}
          path: build/dist/${{ matrix.archive_name }}_${{ needs.extract-changelog.outputs.version }}.zip

  create-release:
    runs-on: ubuntu-latest
    needs: [extract-changelog, build]
    steps:
      - name: Download Win32 artifact
        uses: actions/download-artifact@v4
        with:
          name: AlpacaZorroPlugin_${{ needs.extract-changelog.outputs.version }}
          path: ./artifacts

      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: AlpacaZorroPlugin64_${{ needs.extract-changelog.outputs.version }}
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Changes

            ${{ needs.extract-changelog.outputs.changelog }}

          draft: true
          prerelease: false
          generate_release_notes: false
          files: |
            ./artifacts/AlpacaZorroPlugin_${{ needs.extract-changelog.outputs.version }}.zip
            ./artifacts/AlpacaZorroPlugin64_${{ needs.extract-changelog.outputs.version }}.zip
